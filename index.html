<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A fully functional to-do list with per-task timers, editing, deleting, completion tracking, and local storage." />
  <title>Focus Todo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <section class="app-card">
      <header class="app-header">
        <div>
          <p class="eyebrow">PLAN • FOCUS • FINISH</p>
          <h1>Focus Todo</h1>
          <p class="subtitle">Plan tasks, run a timer, and keep your progress saved.</p>
        </div>
        <button id="clearCompletedBtn" class="secondary-button" type="button">Clear completed</button>
      </header>

      <form id="taskForm" class="task-form" autocomplete="off">
        <div class="field-group task-title-field">
          <label for="taskInput">Task</label>
          <input id="taskInput" type="text" maxlength="120" placeholder="e.g. Finish Python practical" required />
        </div>

        <div class="field-group timer-field">
          <label for="minutesInput">Timer (minutes)</label>
          <input id="minutesInput" type="number" min="1" max="1440" value="25" required />
        </div>

        <button class="primary-button" type="submit">Add task</button>
      </form>

      <section class="toolbar" aria-label="Task filters">
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter-button active" data-filter="all" type="button">All</button>
          <button class="filter-button" data-filter="active" type="button">Active</button>
          <button class="filter-button" data-filter="completed" type="button">Completed</button>
        </div>
        <p id="taskCounter" class="task-counter">0 tasks</p>
      </section>

      <section>
        <ul id="taskList" class="task-list" aria-live="polite"></ul>
        <div id="emptyState" class="empty-state">
          <div class="empty-icon">✓</div>
          <h2>No tasks yet</h2>
          <p>Add your first task above and start planning your day.</p>
        </div>
      </section>
    </section>
  </main>

  <template id="taskTemplate">
    <li class="task-item">
      <div class="task-main-row">
        <label class="check-wrap" aria-label="Mark task complete">
          <input class="complete-checkbox" type="checkbox" />
          <span class="custom-check"></span>
        </label>

        <div class="task-info">
          <h3 class="task-title"></h3>
          <div class="timer-display" aria-label="Remaining time">
            <span class="timer-text">25:00</span>
            <span class="timer-status">Ready</span>
          </div>
        </div>

        <div class="task-actions">
          <button class="icon-button edit-button" type="button" title="Edit task" aria-label="Edit task">Edit</button>
          <button class="icon-button delete-button danger" type="button" title="Delete task" aria-label="Delete task">Delete</button>
        </div>
      </div>

      <div class="timer-controls">
        <button class="timer-button start-button" type="button">Start</button>
        <button class="timer-button pause-button" type="button">Pause</button>
        <button class="timer-button reset-button" type="button">Reset</button>
      </div>
    </li>
  </template>

  <div id="editModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
    <div class="modal-card">
      <h2 id="editModalTitle">Edit task</h2>
      <form id="editForm">
        <div class="field-group">
          <label for="editTaskInput">Task</label>
          <input id="editTaskInput" type="text" maxlength="120" required />
        </div>
        <div class="field-group">
          <label for="editMinutesInput">Timer (minutes)</label>
          <input id="editMinutesInput" type="number" min="1" max="1440" required />
        </div>
        <div class="modal-actions">
          <button id="cancelEditBtn" class="secondary-button" type="button">Cancel</button>
          <button class="primary-button" type="submit">Save changes</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
